server {
    # Define interface:port pairs
    host 127.0.0.1;
    listen 8080;
	    host 0.0.0.0;
    listen 8081;
    server_name localhost;
	root ./www;
    # Set the maximum allowed size for client request bodies
    client_max_body_size 100000;

    # Set up default error pages
    error_page 404 /www/errors/404.html;
    # error_page 500 502 503 504 /www/errors/50x.html;

    # Directory where the requested file should be located
    
    
    # Default file to serve when the requested resource is a directory
    # index index.html;

    # Route 1: Default location
    location / {
        # List of accepted HTTP methods for the route
       methods GET POST DELETE;
        
        # Enabling or disabling directory listing
        autoindex off;
    }

    # # Route 2: HTTP redirection
    # location /old-page {
    #     return 301 http://127.0.0.1:8080/new-page.html;
    # }

    # Route 3: File upload configuration
    location / {
        methods GET POST DELETE;
        autoindex on;
        
        # Uploading files from the clients to the server is authorized, and storage location is provided
        # upload_store ./www/uploads;
    }

    # Route 4: CGI execution based on file extension
    location / {
        methods GET POST DELETE;
		cgi_extension .php; 
        cgi_path ./cgi_tester;
    }
}

# Server 1: listen 8080

server {
    host 127.0.0.1;
    listen 8080;
    server_name localhost;

    root ./www;
    client_max_body_size 1048576;
    index index.html;
	error_page 404 /error_pages/404.html;
	error_page 405 /error_pages/405.html;
	error_page 413 /error_pages/413.html;
	error_page 500 /error_pages/500.html;
	error_page 505 /error_pages/505.html;

    location / {
        methods GET POST;
        index index.html;
        autoindex off;
    }

    location /images {
        methods GET;
        autoindex on;
    }

	location /uploads {
        methods GET POST DELETE;
        upload_store ./www/uploads;
        client_max_body_size 100000;
    }

    location /cgi-bin {
        methods GET POST;
        cgi_extension .py;
		cgi_extension .sh;
    }

	
    location /old-page {
        return 301 http://127.0.0.1:8080/new-page.html;
    }
}

# Server 2: different hostnames"  (8080)
server {
    host 127.0.0.1;
    listen 8080;
    server_name example.com;
    
    root ./www;
    client_max_body_size 100000;
	error_page 404 /error_pages/404.html;

    location / {
		root ./www/example;
        methods GET;
        autoindex off;
        index index.html;
    }
}

# Server 3: 测试 "different ports" (监听 8081 端口)
server {
    host 127.0.0.1;
    listen 8081;
    server_name localhost;
    
    root ./www/port8081;
    client_max_body_size 100000;
	# error_page 404 /error_pages/404.html；

    location / {
        methods GET;
        autoindex on;
    }
}
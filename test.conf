server {
    listen	8080;
    host	127.0.0.1;
	server_name	localhost;
	root		./YoupiBanane; 
	client_max_body_size 1048576;

	# index   youpi.bad_extension;
	# methods	GET HEAD;


    location / {
        methods GET;
		index   youpi.bad_extension;
    }

    location /directory {
        methods			GET POST;
        root 			./YoupiBanane; 
        index			youpi.bad_extension;
		cgi_extension	.bla;
        cgi_path 		./cgi_tester;
    }

    location /post_body {
        methods		POST;
		 root		./YoupiBanane/post_body;
        client_max_body_size 100;
    }

    location *.bla {
        methods POST;
        cgi_extension .bla;
        cgi_path ./cgi_tester;
    }
}
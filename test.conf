server {
    listen 8080;
    host 127.0.0.1;

    location / {
        methods GET;
        root ./; 
        autoindex on;
    }

    location /directory/ {
        methods GET;
        root ./YoupiBanane; 
        index youpi.bad_extension;
    }

    location /post_body {
        methods POST;
        client_max_body_size 100;
    }

    location *.bla {
        methods POST;
        cgi_extension .bla;
        cgi_path ./cgi_tester;
    }
}
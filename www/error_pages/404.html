<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f7f9fc; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); max-width: 360px; width: 100%; }
        h1 { font-size: 3.5rem; margin: 0 0 5px; color: #ff6a59; font-weight: 700; }
        h2 { font-size: 1.2rem; margin: 0 0 15px; color: #2c3e50; font-weight: 600; }
        p { color: #7f8c8d; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
        .footer { font-size: 0.75px; color: #bdc3c7; border-top: 1px solid #edf2f7; padding-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Not Found</h2>
        <p>The page you are looking for does not exist or has been moved.</p>
        <div class="footer">webserv/1.1</div>
    </div>
</body>
</html>
